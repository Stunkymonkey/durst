[package]
name = "durst-proto"
version = "0.1.0"
authors = ["Felix Buehler <account@buehler.rocks>"]
edition = "2024"
description = "shared D-Bus interface definitions for durst and durstctl"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
