[package]
name = "durst"
version = "0.1.0"
authors = ["Felix Buehler <account@buehler.rocks>"]
edition = "2021"
repository = "https://github.com/durst-notification/durst"
homepage = "https://durst-notification.org"
description = "dunst written in Rust"
include = [
    "**/*.rs",
    "Cargo.toml",
]
readme = "README.md"

[dependencies]
clap = "4.5"
dbus = "0.9"
dbus-tree = "0.9"
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
iced = { version = "0.13", features = [
	"default",
	"advanced",
	"image",
	"svg",
	"multi-window",
	"debug",
] }
iced_core = "0.13"
iced_runtime = "0.13"
iced_layershell = "0.9"
linicon = "2.3"

[build-dependencies]
clap = "4.5"
clap_complete = "4.0"
dbus-codegen = "0.12"
