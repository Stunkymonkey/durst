[package]
name = "durst"
version = "0.1.0"
authors = ["Felix Buehler <account@buehler.rocks>"]
edition = "2024"
repository = "https://github.com/durst-notification/durst"
homepage = "https://durst-notification.org"
description = "Wayland notification daemon inspired by dunst"
include = [
    "**/*.rs",
    "Cargo.toml",
]
readme = "README.md"

[dependencies]
durst-proto = { path = "../durst-proto" }
clap = "4.5"
env_logger = "0.11"
futures = "0.3"
regex = "1"
iced = { version = "=0.14.0", default-features = false, features = [
	"advanced",
	"tiny-skia",
	"wgpu",
	"image",
	"svg",
	"tokio",
	"wayland",
] }
# same version as iced; raster icons are scaled by durst, see ui/icons.rs
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
# linux-theme-detection blocks startup on a portal call; colors come from the config
iced_layershell = { version = "=0.19.1", default-features = false }
freedesktop-icons = "0.4"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["sync", "time"] }
toml = "1"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
clap = "4.5"
clap_complete = "4.5"
clap_mangen = "0.2"
