[package]
name = "durstctl"
version = "0.1.0"
authors = ["Felix Buehler <account@buehler.rocks>"]
edition = "2024"
description = "control the durst notification daemon"

[dependencies]
durst-proto = { path = "../durst-proto" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
