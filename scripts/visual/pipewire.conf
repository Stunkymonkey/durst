# A private PipeWire for the visual tests: no hardware, no session manager,
# a null sink and a null source with volume controls, and the "default"
# metadata the scenarios point at them with pw-metadata.
context.properties = {
    core.daemon = true
    core.name = pipewire-0
    support.dbus = false
    mem.allow-mlock = false
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-access }
]
context.objects = [
    { factory = metadata args = { metadata.name = default } }
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = test-sink
          node.description = "Test Speakers"
          media.class      = Audio/Sink
          audio.position   = [ FL FR ]
          object.linger    = true
      }
    }
    { factory = adapter
      args = {
          factory.name     = support.null-audio-sink
          node.name        = test-source
          node.description = "Test Microphone"
          media.class      = Audio/Source/Virtual
          audio.position   = [ FL FR ]
          object.linger    = true
      }
    }
]
