[package]
name = "fake-player"
version = "0.1.0"
edition = "2024"
publish = false
description = "fake MPRIS media player for the visual test harness, driven by stdin"

[dependencies]
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
